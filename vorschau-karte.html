<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Trödelradar – Vorschau neue Karte</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--blue:#1746C9;--yellow:#FFE600;--ink:#141413;--pink:#D9125A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#f4f2ec}
header{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--blue);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header b{font-size:18px}header span{font-size:12px;background:var(--yellow);color:var(--ink);border-radius:20px;padding:2px 10px;font-weight:700}
#map{position:fixed;top:calc(52px + env(safe-area-inset-top));left:0;right:0;bottom:0}
.sheet{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:1000;background:#fff;border-radius:18px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:14px 16px;max-width:520px;margin:0 auto}
.sum{display:flex;gap:16px;align-items:baseline;margin-bottom:8px}
.sum b{font-size:22px;color:var(--blue)}.sum small{color:#555;font-size:13px}
ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:28vh;overflow:auto}
li{display:flex;gap:10px;align-items:center;font-size:14px;line-height:1.25}
li i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--yellow);border:2px solid var(--blue);color:var(--blue);font-style:normal;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
li i.home{background:var(--blue);color:#fff}
li small{display:block;color:#555;font-size:12px}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;min-height:44px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:inherit;font-weight:700;font-size:15px;text-decoration:none;display:flex;align-items:center;justify-content:center}
.btn.alt{background:#eceae3;color:var(--ink)}
.pin{width:30px;height:30px;border-radius:50%;background:var(--yellow);border:3px solid var(--blue);color:var(--blue);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pin.home{background:var(--blue);border-color:#fff;color:#fff}
.note{font-size:12px;color:#555;margin-top:8px}
</style>
</head>
<body>
<header><b>Trödelradar</b><span>Vorschau: neue Karte</span></header>
<div id="map" role="region" aria-label="Karte mit Route"></div>
<div class="sheet">
<div class="sum"><b id="km">…</b><small id="min">Route wird berechnet …</small></div>
<ol id="list"></ol>
<div class="row"><a class="btn" id="gmaps" target="_blank" rel="noopener">In Google Maps navigieren</a><button class="btn alt" id="fit" type="button">Ganze Route</button></div>
<div class="note">Beispiel-Tour am So, 22.11.: Start Rothenburg (91541) zu drei echten Märkten aus der App.</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const stops=[
 {n:'Start: Rothenburg ob der Tauber',s:'91541',lat:49.3771,lon:10.1797,home:true},
 {n:'9. Modellbahnbörse Marktbergel',s:'Am Niederhof, 91613 Marktbergel',lat:49.4416,lon:10.3641},
 {n:'Trödelmarkt Giebelstadt REWE',s:'Langenwiesengraben 3, 97232 Giebelstadt · 6–17 Uhr',lat:49.65,lon:9.94},
 {n:'Fashion Flohmarkt Posthalle',s:'Würzburg · 14–18 Uhr',lat:49.8032,lon:9.9304}
];
const map=L.map('map',{zoomControl:false}).setView([49.55,10.1],9);
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende'}).addTo(map);
const list=document.getElementById('list');
stops.forEach((p,i)=>{
 L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',html:`<div class="pin ${p.home?'home':''}">${p.home?'⌂':i}</div>`,iconSize:[30,30],iconAnchor:[15,15]}),title:p.n}).addTo(map).bindPopup(`<b>${p.n}</b><br>${p.s}`);
 const li=document.createElement('li');li.innerHTML=`<i class="${p.home?'home':''}">${p.home?'⌂':i}</i><div>${p.n}<small>${p.s}</small></div>`;list.appendChild(li);
});
const bounds=L.latLngBounds(stops.map(p=>[p.lat,p.lon]));
const fit=()=>map.fitBounds(bounds,{paddingTopLeft:[30,30],paddingBottomRight:[30,260]});fit();
document.getElementById('fit').onclick=fit;
const g='https://www.google.com/maps/dir/?api=1&origin='+stops[0].lat+','+stops[0].lon+'&destination='+stops.at(-1).lat+','+stops.at(-1).lon+'&waypoints='+stops.slice(1,-1).map(p=>p.lat+','+p.lon).join('|')+'&travelmode=driving';
document.getElementById('gmaps').href=g;
fetch('https://router.project-osrm.org/route/v1/driving/'+stops.map(p=>p.lon+','+p.lat).join(';')+'?overview=full&geometries=geojson')
 .then(r=>r.json()).then(j=>{const r=j.routes[0];
  L.geoJSON(r.geometry,{style:{color:'#ffffff',weight:9,opacity:.9}}).addTo(map);
  L.geoJSON(r.geometry,{style:{color:'#1746C9',weight:5}}).addTo(map);
  document.getElementById('km').textContent=Math.round(r.distance/1000)+' km';
  const m=Math.round(r.duration/60);document.getElementById('min').textContent='ca. '+(m>=60?Math.floor(m/60)+' Std. '+(m%60)+' Min.':m+' Min.')+' Fahrzeit';
 }).catch(()=>{document.getElementById('min').textContent='Route konnte nicht geladen werden'});
</script>
</body>
</html>
