<style>
/* Layout: eine Handy-App wie ein Marktstand. Blaue Plane als Grund, Neon-Preisaufkleber tragen Datum und Status. */

  --tarp:#83A1FF; --on-tarp:#0C1230; --pink:#FF6A9E; --on-pink:#1C0610;
  --good:#4FD69B; --warn:#F2B15C; --bad:#FF7C97;
  --map-land:#18214B; --map-water:#21408F; --map-park:#1E4A3C; --map-road:#2F3A6B; --map-label:#A9B3D3;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0C1230; --paper:#161E45; --sunk:#0F1638; --ink:#EEF1FB; --muted:#A9B3D3; --line:#2E3966;
  --tarp:#83A1FF; --on-tarp:#0C1230; --pink:#FF6A9E; --on-pink:#1C0610;
  --good:#4FD69B; --warn:#F2B15C; --bad:#FF7C97;
  --map-land:#18214B; --map-water:#21408F; --map-park:#1E4A3C; --map-road:#2F3A6B; --map-label:#A9B3D3;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font:16px/1.45 var(--body);overflow:hidden}

.brand{font:800 1.4rem/1 var(--display);letter-spacing:-.02em;flex:1;min-width:0}

.m-route{fill:none;stroke:var(--pink);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 7}
.m-me{fill:var(--tarp);stroke:var(--paper);stroke-width:3}
.pin{cursor:pointer}
.pin polygon{fill:var(--sticker);stroke:var(--on-sticker);stroke-width:1}
.pin text{fill:var(--on-sticker);font:400 15px var(--marker);text-anchor:middle;dominant-baseline:central}
.pin.ad polygon,.pin.today polygon{fill:var(--pink)}.pin.ad text,.pin.today text{fill:var(--on-pink)}
.pin.sel polygon{stroke:var(--ink);stroke-width:2.5}
.pin:focus-visible polygon{stroke:var(--tarp);stroke-width:3}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span,.lab{font-size:.85rem;font-weight:700}
input[type=url],input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],input[type=email],select,textarea{width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:9px;padding:10px;min-height:44px}

.check{display:flex;gap:9px;align-items:center;min-height:36px;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.back{background:none;border:0;width:42px;height:42px;display:grid;place-items:center;margin-left:-8px}

.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.8rem}

.legend i.t{background:var(--sunk);border-color:var(--line)}.legend i.m{background:var(--pink);border-color:var(--pink)}.legend i.s{background:var(--sticker);border-color:var(--on-sticker)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.bars i{display:block;width:100%;background:var(--tarp);border-radius:4px 4px 0 0}

.feed{display:flex;flex-direction:column;gap:18px}

.find .art img{aspect-ratio:4/3;object-fit:cover}

.progress{height:9px;background:var(--sunk);border-radius:9px;overflow:hidden}

.kbtn{text-align:left}
a.btn{text-decoration:none;color:inherit}a.btn.pri{color:var(--on-tarp)}
.m-sea{fill:var(--sunk)}.m-border{stroke:var(--line);stroke-width:1.5;vector-effect:non-scaling-stroke}.m-dot{fill:var(--muted)}

.tl details{background:var(--sunk);border-radius:8px;padding:6px 10px;min-width:0}.tl summary{cursor:pointer;font-weight:700}.tl ol{padding-left:20px;margin-top:6px;display:flex;flex-direction:column;gap:3px}

.planscroll{overflow-x:auto;padding-bottom:4px}.plan{gap:4px;width:max-content}.cell{width:44px;height:44px;aspect-ratio:auto}
.mapwrap.pan{touch-action:pan-y;cursor:pointer;user-select:none;position:relative}.mapwrap.pan svg{aspect-ratio:1/1;max-height:62vh;width:100%}

.pin .hit{fill:transparent}

.bubble{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;align-self:flex-start;max-width:85%}.bubble.mine{align-self:flex-end;background:var(--sunk)}
.proof{border-radius:8px;max-height:260px;object-fit:contain;align-self:flex-start}

 <div class="two"><label class="field"><span>Von</span><input type="time" id="ad-from" value="${m.timeOpen?'':H(m.from)}"></label><label class="field"><span>Bis</span><input type="time" id="ad-to" value="${m.timeOpen||m.endOpen?'':H(m.to)}"></label></div>
 <div class="two"><label class="field"><span>Postleitzahl</span><input type="text" id="ad-plz" inputmode="numeric" maxlength="5" value="${H(m.plz||'')}"></label><label class="field"><span>Ort</span><input type="text" id="ad-ort" value="${H(m.ort)}"></label></div>
 <label class="field"><span>Veranstaltungsort</span><input type="text" id="ad-onm" value="${H(m.ortName||'')}"></label><label class="field"><span>Straße und Hausnummer</span><input type="text" id="ad-addr" value="${H(m.street||'')}"></label>

 <div class="lab">Ausstattung</div><div class="two">${Object.entries(FAC).map(([k,l])=>`<label class="check"><input type="checkbox" id="ad-f-${k}" data-fac="${k}" ${m.fac.includes(k)?'checked':''}><span>${l}</span></label>`).join('')}</div>
 <label class="field"><span>Anfahrt</span><input type="text" id="ad-anf" value="${H(m.anfahrt||'')}"></label><label class="field"><span>Beschreibung</span><textarea id="ad-desc">${H(m.desc||'')}</textarea></label><label class="field"><span>Was gibt es? Stichworte, mit Komma getrennt</span><input type="text" id="ad-goods" value="${H((m.goods||[]).join(', '))}"></label>
 <h3>Ihre Angaben</h3><label class="field"><span>Veranstalter (Verein oder Firma)</span><input type="text" id="cf-org" value="${H(m.organizer||'')}"></label><label class="field"><span>Ihr Name</span><input type="text" id="cf-name"></label><label class="field"><span>Mail für Rückfragen</span><input type="email" id="cf-mail" value="${H((m.invite&&m.invite.mail)||'')}"></label>
 <label class="check"><input type="checkbox" id="cf-ok"><span class="small">Ich bin für diesen Markt verantwortlich oder dazu berechtigt. Die Angaben stimmen.</span></label><p class="err" id="ad-err" hidden></p><button class="btn hot wide">Alle Angaben bestätigen</button></form>
 <button class="link small" data-a="confirmRemove" data-id="${m.id}">${U.confirm==='rm'+m.id?'Ja, Eintrag wirklich entfernen':'Diesen Eintrag entfernen lassen'}</button><p class="xs muted">Datenschutz und Bedingungen finden Sie in der App unter Konto.</p>`)}
function sReport(s){return shell('Eintrag melden',`<form class="stack" data-f="report" data-kind="${H(s.kind)}" data-id="${H(s.id)}"><fieldset class="stack" style="border:0;padding:0;margin:0"><legend class="lab">Was stimmt nicht?</legend>${['Falsche Angaben','Findet nicht statt','Werbung oder Spam','Verbotene Ware','Beleidigend','Private Adresse ohne Erlaubnis','Etwas anderes'].map((r,i)=>`<label class="check"><input type="radio" name="rp" id="rp-${i}" value="${r}" ${i===0?'checked':''}><span>${r}</span></label>`).join('')}</fieldset><label class="field"><span>Hinweis (freiwillig)</span><textarea id="rp-note"></textarea></label><button class="btn pri">Meldung senden</button></form>`)}
function sNotes(){me().notes.forEach(n=>n.read=true);return shell('Benachrichtigungen',me().notes.length?`<div class="list">${me().notes.map(n=>`<button class="item" ${n.mid?`data-a="open" data-id="${n.mid}"`:''}><span class="grow"><span class="tag">${H(n.k)}</span> <span class="xs muted">${ago(n.at)}</span><span class="bold" style="display:block">${H(n.title)}</span><span class="small muted">${H(n.body)}</span></span></button>`).join('')}</div><p class="demo">Im Prototyp erscheinen Nachrichten nur hier. In der Android-App kommen sie als Push.</p>`:'<div class="panel"><b>Keine Benachrichtigungen</b><p class="small muted">Hier erscheinen Antworten auf Anfragen und Meldungen.</p></div>')}
function sLegal(s){const t={impressum:['Impressum','Platzhalter: Vor der Veröffentlichung kommen hier dein Name, deine Anschrift und deine Kontaktdaten hin.'],datenschutz:['Datenschutz','Platzhalter: Vor der Veröffentlichung kommt hier die Datenschutzerklärung hin. Sie beschreibt Konto, Postleitzahl und Standort, Fotos, Nachweise, Abos über Google Play, Statistik und Benachrichtigungen.'],agb:['Nutzungsbedingungen','Platzhalter: Hier stehen die Regeln für Einträge, Vermittlung von Standplätzen, Sperren von Konten und die Haftung.']}[s.k];return shell(t[0],`<p>${t[1]}</p><p class="small muted">Diese Texte solltest du vor dem Start rechtlich prüfen lassen.</p>`)}
function shell(title,body,extra=''){return`<div class="sheet" role="dialog" aria-label="${H(title)}"><div class="shead g"><button class="back" data-a="close" aria-label="Zurück">${ic('back')}</button><h2>${H(title)}</h2>${extra}</div><div class="sbody g">${body}</div></div>`}

function vPlan(){const opts=[['over','Übersicht'],['route','Fahrroute'],['fav','Gemerkt']];if(st(2))opts.push(['lists','Suchlisten'],['radar','Radar']);if(!opts.find(o=>o[0]===U.seg.plan))U.seg.plan='over';return`<h1>Planen</h1>${segs('plan',opts)}${{over:()=>tipPanel()+vPlanOver(),route:vRoute,fav:()=>wxPanel()+vFav(),lists:vLists,radar:vRadar}[U.seg.plan]()}`}
function pastFavs(){const b=me();return S.markets.filter(m=>b.fav[m.id]&&pub(m)&&isOver(m)).sort((a,c)=>lastD(c).localeCompare(lastD(a)))}
function vSaved(){const L=savedList(),b=me();if(!L.length)return'';return`<h2>Gemerkte Termine</h2><div class="stack">${L.map(({m,d})=>`<div class="panel"><div class="swatch">${dateSticker(d)}<div class="grow"><button class="link" data-a="open" data-id="${m.id}">${H(m.name)}</button><p class="small muted">${fmtD(d)} ${parse(d).getFullYear()} · ${H(fmtT(m))} · ${H(m.ort)}</p></div></div><div class="rowx"><button class="btn sm" data-a="calMenu" data-id="${m.id}" data-date="${d}" aria-expanded="${U.calFor===m.id+d}">Kalender</button><button class="btn sm" data-a="addRoute" data-id="${m.id}" data-date="${d}">${(b.routes[d]||[]).includes(m.id)?'In der Route':'Zur Route'}</button><button class="btn sm" data-a="saveDate" data-id="${m.id}" data-date="${d}">Entfernen</button></div>${U.calFor===m.id+d?calOpts(m,d):''}</div>`).join('')}</div>${L.length>1?`<button class="btn sm" style="align-self:flex-start" data-a="icsSaved">Alle ${L.length} Termine in den Kalender</button>`:''}<h2>Gemerkte Märkte</h2>`}
function vFav(){const p=pastFavs(),sv=vSaved();return sv+vFavNow(p.length>0||!!sv)+(p.length?`<h2>Vergangene Märkte</h2><p class="small muted">Für diese Märkte sind gerade keine Termine bekannt.</p><div class="list">${p.map(m=>`<button class="item" data-a="open" data-id="${m.id}"><span class="grow"><b style="display:block">${H(m.name)}</b><span class="small muted">Letzter Termin ${fmtD(lastD(m))} · ${H(m.ort)}</span></span></button>`).join('')}</div>`:'')}
function pastTrips(b){const D=Object.keys(b.routes).filter(d=>dayDiff(d)<0&&(b.routes[d]||[]).some(id=>mk(id))).sort().reverse();return D.length?`<details class="plzbox"><summary>Vergangene Ausflüge (${D.length})</summary><div class="stack" style="gap:6px">${D.slice(0,30).map(d=>`<div><b class="small">${fmtD(d)} ${parse(d).getFullYear()}</b>${b.routes[d].map(mk).filter(Boolean).map(m=>`<button class="link small" style="display:block" data-a="open" data-id="${m.id}">${H(m.name)}</button>`).join('')}</div>`).join('')}</div></details>`:''}
function vFavNow(hasPast){const b=me(),L=S.markets.filter(m=>b.fav[m.id]&&shown(m)).sort((a,c)=>nextD(a).localeCompare(nextD(c)));if(!L.length&&hasPast)return savedList().length?'<p class="small muted">Noch kein ganzer Markt gemerkt. Tippe im Markt oben auf Merken, dann siehst du immer seinen nächsten Termin.</p>':'';if(!L.length)return'<div class="panel"><b>Noch nichts gemerkt</b><p class="small muted">Öffne einen Markt und tippe auf Merken.</p><button class="btn sm" data-a="tab" data-k="discover" style="align-self:flex-start">Märkte ansehen</button></div>';
 return`<div class="stack">${L.map(m=>{const r=b.fav[m.id].remind||'',d=nextD(m),when=LIVE?'':r==='abend'?`${fmtD(iso(add(parse(d),-1)))} um 18:00`:r==='morgen'?`${fmtD(d)}, 1 Std. vor Beginn`:'';return`<div class="panel"><div class="swatch">${dateSticker(d)}<div class="grow"><button class="link" data-a="open" data-id="${m.id}">${H(m.name)}</button><p class="small muted">${H(fmtT(m))}${hasHome()?' · '+fmtKm(dist(m)):''}</p></div></div><label class="field"><span>Erinnerung</span><select id="rem-${m.id}" data-ch="remind" data-id="${m.id}"><option value="">Keine</option><option value="abend" ${r==='abend'?'selected':''}>Am Abend vorher</option><option value="morgen" ${r==='morgen'&&!m.timeOpen?'selected':''} ${m.timeOpen?'disabled':''}>1 Stunde vor Beginn</option></select></label>${when?`<p class="small">Du wirst erinnert: ${when}</p>`:''}<div class="rowx"><a class="btn sm" href="${H(gcalUrl(m,d))}" target="_blank" rel="noopener" data-a="calHit" data-id="${m.id}">Kalender</a><button class="btn sm" data-a="addRoute" data-id="${m.id}" data-date="${d}">${(b.routes[d]||[]).includes(m.id)?'In der Route':'Zur Route'}</button></div></div>`}).join('')}</div>`}
const SPEED={auto:1.2,rad:4,fuss:12},SPRIT=.12;
const STREETS=['Hauptstraße','Ringstraße','Bahnhofstraße','Marktstraße','Landstraße','Schulstraße','Gartenstraße','Bundesstraße'];
const legKm=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y)*KM*1.25;
const legPts=(a,b)=>{const my=(a.y+b.y)/2;return[[a.x,a.y],[a.x,my],[b.x,my],[b.x,b.y]]};
function routeCalc(ids,mode){const O=me().routeOpt,v=SPEED[mode],ms=ids.map(mk).filter(Boolean),h=ME();if(!ms.length)return{stops:[],km:0,drive:0,v,start:null,end:null,homeKm:0};const start=O.depart?toMin(O.depart):Math.max(0,toMin(ms[0].from)-legKm(h,ms[0])*v);let t=start,prev=h,km=0,drive=0;
 const stops=ms.map(m=>{const d=legKm(prev,m),travel=d*v;km+=d;drive+=travel;const reach=t+travel,open=toMin(m.from),close=toMin(m.to),arr=Math.max(reach,open),dw=O.dwell[m.id]||45,dep=arr+dw,r={m,arr,dep,d,travel,wait:arr-reach,dw,late:!m.timeOpen&&!m.endOpen&&arr>=close,tight:!m.timeOpen&&!m.endOpen&&arr<close&&close-arr<dw,from:prev};t=dep;prev=m;return r});let homeKm=0,end=t;if(O.home){homeKm=legKm(prev,h);km+=homeKm;drive+=homeKm*v;end=t+homeKm*v}return{stops,km,drive,v,start,end,homeKm,last:prev}}
const fmtDur=m=>{m=Math.round(m);return m<60?m+' Min.':Math.floor(m/60)+' Std.'+(m%60?' '+m%60+' Min.':'')};
function legSteps(a,b,seed,dest){const dir=(dx,dy)=>Math.abs(dx)>Math.abs(dy)?(dx>0?'Osten':'Westen'):(dy>0?'Süden':'Norden');return[`Grobe Richtung: ${dir(b.x-a.x,b.y-a.y)}, etwa ${fmtKm(legKm(a,b))}`,`Ziel: ${dest}`,'Die genaue Strecke zeigt Google Maps.']}
function routeMapBox(ids){const ms=ids.map(mk).filter(Boolean),h=ME(),key='route'+U.routeDay;if(!U.views[key]||U.views[key+'n']!==ids.join()){const xs=[h.x,...ms.map(m=>m.x)],ys=[h.y,...ms.map(m=>m.y)],half=Math.max(240,Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))/2*1.3);U.views[key]={x:(Math.max(...xs)+Math.min(...xs))/2,y:(Math.max(...ys)+Math.min(...ys))/2,half};U.views[key+'n']=ids.join()}const v=U.views[key],k=v.half/200,pts=[];let prev=h;ms.forEach(m=>{const l=legPts(prev,m);(pts.length?l.slice(1):l).forEach(x=>pts.push(x));prev=m});const line=pts.map(p=>p.join(',')).join(' ');const home=me().routeOpt.home&&ms.length?legPts(prev,h).map(p=>p.join(',')).join(' '):'';const anim=U.routePlay&&pts.length&&!matchMedia('(prefers-reduced-motion:reduce)').matches;
 return mapBox(key,baseMap(`${home?`<polyline class="m-rhome" points="${home}"/>`:''}${line?`<polyline class="m-rcase" points="${line}"/><polyline class="m-rline" points="${line}"/>`:''}<circle cx="${h.x}" cy="${h.y}" r="${7*k}" class="m-me"/>${ms.map((m,i)=>pinEl(m,false,k,i+1,'open')).join('')}${anim?`<circle r="${8*k}" class="m-car"><animateMotion dur="9s" repeatCount="indefinite" path="M${pts.map(p=>p.join(' ')).join('L')}"/></circle>`:''}`,v,ms))}
function marketDays(){return[...new Set(S.markets.filter(shown).flatMap(upcoming))].sort()}
function vPlanOver(){const b=me(),O=b.routeOpt,dated=Object.keys(b.routes).filter(d=>dayDiff(d)>=0&&(b.routes[d]||[]).some(id=>mk(id))).sort(),next=dated[0],favs=Object.keys(b.fav).filter(id=>mk(id)&&shown(mk(id))).length+savedList(b).length;let hero;
 if(next){const ids=b.routes[next].filter(id=>mk(id)),c=routeCalc(ids,b.routeMode),n=dayDiff(next);hero=`<div class="planhero"><div class="swatch">${dateSticker(next)}<div class="grow"><span class="small">${n===0?'Dein Ausflug ist heute':n===1?'Morgen geht es los':`Noch ${n} Tage bis zum Ausflug`}</span><h2>${ids.length} ${ids.length===1?'Markt':'Märkte'}${hasHome()?', ca. '+fmtKm(c.km):''}</h2>${hasHome()?`<p class="small">Abfahrt ${toT(c.start)} · zurück gegen ${toT(c.end)}</p>`:''}</div></div><button class="btn hot wide" data-a="planDay" data-d="${next}">Fahrroute ansehen</button></div>`}

function vAlert(m){const unl=proOn('veranstalter');return`<form class="stack" data-f="sendAlert"><label class="field"><span>Nachricht</span><textarea id="al-t" maxlength="160" placeholder="Was müssen alle sofort wissen?"></textarea></label><div class="stack" style="gap:0">${ALERTS.map((a,i)=>`<button type="button" class="link small" data-a="alertTpl" data-i="${i}">${H(a)}</button>`).join('')}</div><p class="err" id="al-err" hidden></p><button class="btn pri">An ${alertReach(m)} ${alertReach(m)===1?'Person':'Personen'} senden</button><p class="small muted">Erreicht alle, die den Markt gemerkt haben oder einen zugesagten Platz haben, und erscheint auf der Marktseite. ${unl?'':`Du hast ${Math.min(m.alerts.length,ALERT_LIMIT)} von ${ALERT_LIMIT} Eilmeldungen genutzt. Mit Pro sind es unbegrenzt viele.`}</p></form><h2>Gesendet</h2>${m.alerts.length?`<div class="list">${m.alerts.map(a=>`<div class="item"><span class="grow">${H(a.text)}<br><span class="small muted">${ago(a.at)}</span></span></div>`).join('')}</div>`:'<p class="muted small">Noch keine Eilmeldung.</p>'}`}
function seriesDates(start,rule,n){const out=[],d0=parse(start);if(rule==='monat'){const nth=Math.ceil(d0.getDate()/7),wd=d0.getDay();let y=d0.getFullYear(),mo=d0.getMonth();for(let i=0;i<n;i++){mo++;if(mo>11){mo=0;y++}const f=new Date(y,mo,1),o=(wd-f.getDay()+7)%7;let day=1+o+(nth-1)*7;const last=new Date(y,mo+1,0).getDate();while(day>last)day-=7;out.push(iso(new Date(y,mo,day)))}}else{const s=rule==='woche'?7:14;for(let i=1;i<=n;i++)out.push(iso(add(d0,i*s)))}return out}
function vSeries(m){const a=upcoming(m);return`<form class="panel" data-f="addDate"><h3>Einzelnen Termin ergänzen</h3><div class="rowx" style="flex-wrap:nowrap"><input type="date" id="dt-one" min="${iso(today0())}" aria-label="Datum"><button class="btn pri">Hinzufügen</button></div><p class="err" id="dt-err" hidden></p></form><form class="panel" data-f="series"><h3>Serie anlegen</h3><p class="small muted">Ausgehend vom ${fmtD(a[a.length-1]||nextD(m))}</p><div class="two"><label class="field"><span>Rhythmus</span><select id="se-r"><option value="monat">Jeden Monat, gleicher Wochentag</option><option value="zwei">Alle 2 Wochen</option><option value="woche">Jede Woche</option></select></label><label class="field"><span>Anzahl</span><input type="number" id="se-n" min="1" max="12" value="6"></label></div><button class="btn pri">Termine anlegen</button></form><h2>Alle Termine</h2><div class="list">${a.map(d=>`<div class="item"><span class="grow bold">${fmtD(d)} ${parse(d).getFullYear()}</span>${a.length>1?`<button class="link small" data-a="seriesDel" data-d="${d}">Absagen</button>`:''}</div>`).join('')}</div>`}
function vPromo(m){return`<div class="panel"><h3>Eintrag hervorheben</h3><p class="small">Dein Markt steht in der Liste ganz oben, bekommt einen pinken Punkt und wird als Anzeige gekennzeichnet.</p><div class="between"><span class="price">4,90 € für 7 Tage</span><button class="btn ${m.promo?'':'hot'} sm" data-a="togglePromo">${m.promo?'Beenden':'Hervorheben (Demo)'}</button></div></div><div class="panel"><h3>So verdient die App Geld</h3><dl class="facts"><dt>Hervorhebung</dt><dd>4,90 € pro 7 Tage</dd><dt>Pro-Abo</dt><dd>ab 4,99 € im Monat</dd>${st(3)?`<dt>Plus</dt><dd>1,99 € im Monat</dd><dt>Partner-Slot</dt><dd>${eur(PARTNER_FEE)} im Monat</dd>`:''}</dl><p class="small muted">Preise sind Vorschläge.</p></div>`}

/* ---------- Konto ---------- */
function proBtn(k,pl,l){const on=me().pro===k&&(me().proPlan||'monat')===pl;return`<button class="btn sm ${on?'hot':''}" aria-pressed="${on}" data-a="setPro" data-k="${k}" data-plan="${pl}">${on?'Kündigen':l}</button>`}
function vKonto(){const u=cu();const legal=`${contactBlock()}<div class="rowx"><button class="link small" data-a="legal" data-k="impressum">Impressum</button><button class="link small" data-a="legal" data-k="datenschutz">Datenschutz</button><button class="link small" data-a="legal" data-k="agb">Nutzungsbedingungen</button></div>`;
 if(!u&&LIVE)return vAuth(legal);
 if(!u)return`<h1>Konto</h1><form class="panel" data-f="register"><h3>Anmelden oder Konto anlegen</h3><p class="small muted">Im Prototyp ohne Passwort und ohne Mailversand. Gibt es den Namen schon, meldest du dich damit an.</p><label class="field"><span>Name</span><input type="text" id="rg-name" autocomplete="name"></label><label class="field"><span>Mail</span><input type="email" id="rg-mail" autocomplete="email"></label><label class="field"><span>Ich bin</span><select id="rg-role"><option value="besucher">Besucher</option>${st(2)?'<option value="verkaeufer">Verkäufer</option>':''}<option value="veranstalter">Veranstalter</option><option value="admin">Administrator (nur im Prototyp)</option></select></label><p class="err" id="rg-err" hidden></p><button class="btn pri">Weiter</button></form><p class="small muted">Ohne Konto kannst du Märkte ansehen, merken und melden. Eintragen, bewerten und Live-Meldungen gehen nur mit Konto.</p>${legal}`;
 const roles=Object.entries(ROLE).filter(([k])=>k!=='gast'&&(k!=='verkaeufer'||st(2)));
 return`<h1>Hallo, ${H(u.name)}</h1>${u.blocked?'<div class="alert">Dein Konto ist gesperrt. Du kannst nichts eintragen oder bewerten.</div>':''}${LIVE?vRoleLive(u):`<div class="panel"><h3>Testen als</h3><p class="small muted">So siehst du die App aus Sicht jeder Rolle. Später hat nur dein Konto die Rolle Administrator.</p><div class="seg">${roles.map(([k,l])=>chip(l,u.role===k,'setRole',`data-k="${k}"`)).join('')}</div></div>`}<div class="panel">${plzForm()}</div>
 ${st(3)?vPlus():''}
 ${st(2)?`<h2>Pro-Abo</h2><div class="stack"><div class="tier ${me().pro==='haendler'?'on':''}"><div class="between"><h3>Pro für Händler</h3></div><ul class="small"><li>Vorrang auf Wartelisten</li><li>Beliebig viele Stand-Vorschauen</li><li>Einnahmen als CSV exportieren</li><li>Stammkunden folgen dir und bekommen deine Meldungen</li><li>Marktvergleich: Gebühr, Interesse, dein Ergebnis</li><li>Gewinn pro Markt nach Gebühr und Sprit</li><li>Ware vorab zeigen und zurücklegen lassen</li><li>QR-Schild für den Stand</li><li>Hervorhebung in der Standliste</li></ul><div class="two">${proBtn('haendler','monat','4,99 € im Monat')}${proBtn('haendler','jahr','49 € im Jahr')}</div></div><div class="tier ${me().pro==='veranstalter'?'on':''}"><div class="between"><h3>Pro für Veranstalter</h3></div><ul class="small"><li>Beliebig viele Märkte statt ${LIM.markets}</li><li>Statistik zu Reichweite und Suchbegriffen</li><li>Unbegrenzte Eilmeldungen statt ${ALERT_LIMIT} pro Markt</li><li>Terminplaner gegen Überschneidungen</li><li>Werbepaket: Bild, Plakat und Text</li><li>Terminliste für deine Webseite</li><li>Einmal im Monat Hervorhebung inklusive</li><li>Händler-Verteiler</li><li>Automatische Warteliste</li><li>Team-Zugang</li><li>Bericht als PDF</li></ul><div class="two">${proBtn('veranstalter','monat','19 € im Monat')}${proBtn('veranstalter','jahr','190 € im Jahr')}</div>${me().vereinReq&&me().vereinReq.status==='offen'&&me().proPlan!=='verein'?'<p class="small bold">Dein Antrag auf den Vereinspreis wird geprüft.</p>':proBtn('veranstalter','verein','Vereinspreis: 9 € im Monat')}<p class="xs muted">Der Vereinspreis gilt für gemeinnützige Einrichtungen und wird vorab geprüft. Demo: Im Prototyp wird nichts abgebucht.</p></div></div>`:''}
 ${legal}${U.confirm==='del'?`<div class="panel"><b>Konto wirklich endgültig löschen?</b><p class="small">Gelöscht wird alles von diesem Konto: Einträge, Funde, Preis-Checks, Schätzungen, Bewertungen, Reservierungen, Nachrichten, Meldungen, Nachweise, Veranstalter-Seite, Merklisten, Einnahmen und Abos. Das lässt sich nicht rückgängig machen.</p><div class="rowx"><button class="btn bad sm" data-a="delAcc">Ja, alles löschen</button><button class="btn sm" data-a="askConfirm" data-k="">Abbrechen</button></div></div>`:`<div class="rowx"><button class="btn sm" data-a="logout">Abmelden</button><button class="btn bad sm" data-a="askConfirm" data-k="del">Konto löschen</button></div>`}${st(3)?creatorBlock()+refBlock():''}`}

/* ---------- Admin ---------- */
function vAdmin(){const open=S.markets.filter(m=>m.review&&!m.removed).length+S.reports.length+S.claims.filter(c=>c.status==='offen').length;const o=[['review',`Prüfen${open?` (${open})`:''}`],['data','Daten'],['accounts','Konten']];if(st(2))o.push(['vereine','Vereine']);if(st(3))o.push(['partner','Partner'],['creator','Creator']);o.push(['start','Startumfang']);return`<h1>Admin</h1><p class="small muted">Diesen Bereich sehen nur Administratoren. In der echten App schützt ihn der Server.</p>${segs('admin',o)}${{review:vQueue,data:vData,accounts:vAccounts,partner:vPartnerAdmin,creator:vCreatorAdmin,vereine:vVereinAdmin,start:vStart}[U.seg.admin]()}`}
function vQueue(){const nw=S.markets.filter(m=>m.review&&!m.removed),cl=S.claims.filter(c=>c.status==='offen'),R=S.reports;if(!nw.length&&!R.length&&!cl.length)return'<div class="panel"><b>Alles geprüft</b><p class="small muted">Gerade liegt nichts an.</p></div>';const acct=id=>S.accounts[id]?S.accounts[id].name:'Unbekannt';
 return`<div class="stack">${cl.map(c=>{const m=mk(c.mid);return`<div class="panel"><span class="tag warn" style="align-self:flex-start">Übernahme mit Nachweis</span><b>${H(m?m.name:'Entfernt')}</b><dl class="facts"><dt>Konto</dt><dd>${H(acct(c.by))}</dd><dt>Name</dt><dd>${H(c.name)}</dd><dt>Verein/Firma</dt><dd>${H(c.org)}</dd><dt>Mail</dt><dd>${H(c.mail)}</dd>${c.tel?`<dt>Telefon</dt><dd>${H(c.tel)}</dd>`:''}${c.link?`<dt>Link</dt><dd>${/^https?:/.test(c.link)?`<a href="${H(c.link)}" target="_blank" rel="noopener">${H(c.link)}</a>`:H(c.link)}</dd>`:''}${c.fileName?`<dt>Datei</dt><dd>${H(c.fileName)}</dd>`:''}${c.note?`<dt>Hinweis</dt><dd>${H(c.note)}</dd>`:''}${m&&m.organizer?`<dt>Laut Quelle</dt><dd>${H(m.organizer)}</dd>`:''}</dl>${c.file?`<img src="${c.file}" alt="Nachweis" class="proof">`:''}${c.proof?`<button class="btn sm" data-a="sbProof" data-id="${c.id}" style="align-self:flex-start">Nachweis öffnen</button>`:''}${m&&m.src?`<a class="btn sm" style="align-self:flex-start" href="${H(m.src)}" target="_blank" rel="noopener">Quelle des Eintrags</a>`:''}<p class="small muted">Prüfe, ob Name, Mail und Link wirklich zum Veranstalter gehören. Im Zweifel rufe an.</p><div class="rowx"><button class="btn pri sm" data-a="claimOk" data-id="${c.id}">Nachweis passt, freigeben</button><button class="btn bad sm" data-a="claimNo" data-id="${c.id}">Ablehnen</button></div></div>`}).join('')}
 ${nw.map(m=>`<div class="panel"><span class="tag warn" style="align-self:flex-start">${m.pending?'Erster Eintrag, noch nicht sichtbar':'Neuer Eintrag'}</span><b>${H(m.name)}</b><p class="small muted">${fmtD(nextD(m))} · ${H(fmtPlace(m))} · von ${H(acct(m.owner))}</p><div class="rowx"><button class="btn sm" data-a="open" data-id="${m.id}">Ansehen</button><button class="btn sm" data-a="approve" data-id="${m.id}">Freigeben</button><button class="btn bad sm" data-a="removeM" data-id="${m.id}">Entfernen</button></div></div>`).join('')}
 ${R.map(r=>{const t=repTarget(r);const nm=t?(t.name||t.title):'Bereits entfernt',ow=t&&t.owner;return`<div class="panel"><span class="tag bad" style="align-self:flex-start">Meldung: ${H(r.reason)}</span><b>${H(nm)}</b>${r.note?`<p class="small">${H(r.note)}</p>`:''}<p class="small muted">${ago(r.at)}${ow&&S.accounts[ow]?' · Inhalt von '+H(S.accounts[ow].name):''}</p><div class="rowx"><button class="btn sm" data-a="repKeep" data-id="${r.id}">Behalten</button><button class="btn bad sm" data-a="repRemove" data-id="${r.id}">Entfernen</button>${ow&&S.accounts[ow]&&!S.accounts[ow].blocked&&ow!==S.user?`<button class="btn bad sm" data-a="block" data-id="${ow}">Konto sperren</button>`:''}</div></div>`}).join('')}</div>`}
function repTarget(r){return r.kind==='market'?mk(r.target):r.kind==='check'?S.checks.find(c=>c.id===r.target):S.finds.find(f=>f.id===r.target)}
function careRow(m,over){return`<div class="item"><div class="grow stack" style="gap:6px"><div><button class="link" data-a="open" data-id="${m.id}">${H(m.name)}</button><p class="small muted">${over?'Letzter':'Letzter geplanter'} Termin ${fmtD(lastD(m))} · ${H(m.ort)}${m.contactMail?' · '+H(m.contactMail):''}</p></div><form class="rowx" data-f="careDate" data-id="${m.id}" style="flex-wrap:nowrap"><input type="date" id="cd-${m.id}" min="${iso(today0())}" aria-label="Neuer Termin für ${H(m.name)}" style="flex:1;min-width:0"><button class="btn sm">Eintragen</button></form><div class="rowx"><button class="btn sm" data-a="careAsk" data-id="${m.id}">Anfrage kopieren</button>${over?`<button class="btn sm" data-a="careArchive" data-id="${m.id}">Archivieren</button>`:''}</div></div></div>`}
function dataCare(){const L=S.markets.filter(m=>!m.removed&&!m.pending&&!isArchived(m)),over=L.filter(isOver).sort((a,b)=>lastD(b).localeCompare(lastD(a))),soon=L.filter(m=>!isOver(m)&&dayDiff(lastD(m))<=30).sort((a,b)=>lastD(a).localeCompare(lastD(b))),arch=S.markets.filter(m=>!m.removed&&isArchived(m));return`<h2>Terminpflege</h2><p class="small muted">Vergangene Märkte verschwinden automatisch aus Suche und Karte. Nach 24 Monaten ohne Termin werden sie archiviert.</p><h3>Keine künftigen Termine (${over.length})</h3>${over.length?`<div class="list">${over.slice(0,100).map(m=>careRow(m,true)).join('')}</div>`:'<p class="small muted">Gerade keine.</p>'}<h3>Laufen in 30 Tagen aus (${soon.length})</h3>${soon.length?`<div class="list">${soon.slice(0,100).map(m=>careRow(m,false)).join('')}</div>`:'<p class="small muted">Gerade keine.</p>'}${arch.length?`<h3>Archiviert (${arch.length})</h3><div class="list">${arch.map(m=>`<div class="item"><span class="grow small"><b>${H(m.name)}</b><br>Letzter Termin ${fmtD(lastD(m))}</span><button class="btn sm" data-a="careRestore" data-id="${m.id}">Wiederherstellen</button></div>`).join('')}</div>`:''}`}
function seenAdmin(){const L=[];S.markets.forEach(m=>Object.keys(m.seen||{}).forEach(d=>{const c=seenOf(m,d);if(c.no)L.push({m,d,c})}));L.sort((a,b)=>b.c.no-a.c.no);return L.length?`<h2>Rückmeldungen von Besuchern</h2><p class="small muted">Hier melden Besucher, dass ein Markt nicht stattfand. Prüfe den Termin und passe ihn bei Bedarf an.</p><div class="list">${L.map(({m,d,c})=>`<div class="item"><div class="grow"><button class="link" data-a="open" data-id="${m.id}">${H(m.name)}</button><p class="small muted">${fmtD(d)} · ${H(m.ort)} · ${c.no}× nein, ${c.yes}× ja</p><button class="btn sm" data-a="seenClear" data-id="${m.id}" data-d="${d}">Erledigt</button></div></div>`).join('')}</div>`:''}
function vData(){const home=geo(START.lat,START.lon),dh=m=>Math.hypot(m.x-home.x,m.y-home.y)*KM,L=S.markets.filter(m=>m.real&&!m.removed&&!m.confirmed&&!isOver(m)).sort((a,b)=>(dh(a)<=START.radius?0:1)-(dh(b)<=START.radius?0:1)||nextD(a).localeCompare(nextD(b)));const reg=L.filter(m=>dh(m)<=START.radius),withMail=reg.filter(m=>m.contactMail||m.contactUrl).length;const soon=L.filter(m=>dayDiff(nextD(m))<=14).length,removed=[...S.markets.filter(m=>m.removed),...S.finds.filter(f=>f.removed),...S.checks.filter(c=>c.removed)];const counts={z:L.filter(m=>m.status==='zwei_quellen').length,e:L.filter(m=>m.status==='quelle_bestaetigt').length,n:L.filter(m=>m.status==='nicht_bestaetigt').length};
 return`<div class="kpis"><div class="kpi"><b>${L.length}</b><span class="small muted">unbestätigte Märkte</span></div><div class="kpi"><b>${soon}</b><span class="small muted">davon in 14 Tagen</span></div><div class="kpi"><b>${counts.z+counts.e}</b><span class="small muted">in einer Quelle gesehen</span></div><div class="kpi"><b>${counts.n}</b><span class="small muted">noch zu prüfen</span></div></div><div class="panel"><h3>Veranstalter um Bestätigung bitten</h3><p class="small">In der Region Rothenburg warten ${reg.length} Märkte auf eine Bestätigung, für ${withMail} kennen wir schon einen öffentlichen Kontakt. Über „Bestätigung anfragen“ bekommst du je Markt einen fertigen Text mit persönlichem Link.</p></div>${seenAdmin()}${dataCare()}<h2>Termine prüfen</h2><p class="small muted">Märkte aus der Region Rothenburg stehen zuerst.</p><div class="list">${L.slice(0,60).map(m=>`<div class="item"><div class="grow"><button class="link" data-a="open" data-id="${m.id}">${H(m.name)}</button><p class="small muted">${fmtD(nextD(m))} · ${H(m.ort)} · ${H(checkedT(m))}</p><div class="rowx" style="margin-top:4px">${statusTag(m)}</div><div class="rowx" style="margin-top:6px">${m.src?`<a class="btn sm" href="${H(m.src)}" target="_blank" rel="noopener">Quelle</a>`:''}<button class="btn sm" data-a="markChecked" data-id="${m.id}">Heute geprüft</button><button class="btn pri sm" data-a="openInvite" data-id="${m.id}">${m.invite?'Erneut anfragen':'Bestätigung anfragen'}</button></div>${m.invite?`<p class="small">Angefragt ${ago(m.invite.at)}${m.invite.mail?' · '+H(m.invite.mail):''}</p>`:''}</div></div>`).join('')}</div><h2>Entfernte Inhalte</h2>${removed.length?`<div class="list">${removed.map(x=>`<div class="item"><span class="grow">${H(x.name||x.title)}</span><button class="btn sm" data-a="restore" data-id="${x.id}">Wiederherstellen</button></div>`).join('')}</div>`:'<p class="small muted">Nichts entfernt.</p>'}`}

function pdfFromCanvases(cs){const enc=new TextEncoder(),parts=[],off=[];let n=0;const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);n+=b.length},obj=(i,body)=>{off[i]=n;push(i+' 0 obj\n');body();push('\nendobj\n')};push('%PDF-1.4\n');const P=cs.length;obj(1,()=>push('<</Type/Catalog/Pages 2 0 R>>'));obj(2,()=>push(`<</Type/Pages/Count ${P}/Kids[${cs.map((_,i)=>(3+i*3)+' 0 R').join(' ')}]>>`));cs.forEach((c,i)=>{const pg=3+i*3,im=pg+1,ct=pg+2,W=595,Ht=842,j=atob(c.toDataURL('image/jpeg',.88).split(',')[1]),b=Uint8Array.from(j,ch=>ch.charCodeAt(0));obj(pg,()=>push(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${Ht}]/Resources<</XObject<</I ${im} 0 R>>>>/Contents ${ct} 0 R>>`));obj(im,()=>{push(`<</Type/XObject/Subtype/Image/Width ${c.width}/Height ${c.height}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${b.length}>>\nstream\n`);push(b);push('\nendstream')});const s=`q ${W} 0 0 ${Ht} 0 0 cm /I Do Q`;obj(ct,()=>push(`<</Length ${s.length}>>\nstream\n${s}\nendstream`))});const t=n,cnt=3+P*3;push(`xref\n0 ${cnt}\n0000000000 65535 f \n`);for(let i=1;i<cnt;i++)push(String(off[i]).padStart(10,'0')+' 00000 n \n');push(`trailer<</Size ${cnt}/Root 1 0 R>>\nstartxref\n${t}\n%%EOF`);return new Blob(parts,{type:'application/pdf'})}

function wxFor(m,d){const n=dayDiff(d);if(n<0||n>6)return null;let h=7;for(const ch of m.id+d)h=(h*31+ch.charCodeAt(0))%9973;const mo=parse(d).getMonth(),base=[3,4,8,13,18,22,24,24,19,13,7,4][mo],t=base+(h%7)-3,k=h%10;return{rain:k<3,txt:k<3?'Regen wahrscheinlich':k<7?'Bewölkt':'Überwiegend trocken',temp:t}}

function wxNotify(){if(!st(3)||!S.user||!isPlus())return;const b=me();b.wxNoted=b.wxNoted||{};Object.keys(b.fav).forEach(id=>{const m=mk(id);if(!m||!shown(m))return;const d=upcoming(m).find(x=>dayDiff(x)===1);if(!d||b.wxNoted[id+d])return;const w=wxFor(m,d);if(w&&w.rain&&!isIndoor(m)){b.wxNoted[id+d]=1;const alt=indoorNear(m,d);noteTo(b,'Marktwetter',`Morgen Regen bei ${m.name}`,alt?`Alternative in einer Halle: ${alt.name}.`:'Nimm eine Regenjacke mit.',m.id)}})}
